name: docscan_scanner
description: "IDSnap — offline identity and everyday document vault."
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  feature_authenticator:
    path: ../../packages/features/authenticator
  engine_authenticator:
    path: ../../packages/engines/authenticator
  feature_notes:
    path: ../../packages/features/notes
  feature_qr:
    path: ../../packages/features/qr
  engine_codes:
    path: ../../packages/engines/codes
  # QR/barcode scanning for the authenticator and the QR & barcode tool.
  # Android uses the bundled ML Kit barcode model (never the Play-services
  # download); iOS uses Apple Vision.
  mobile_scanner: ^7.1.2
  feature_paywall:
    path: ../../packages/features/paywall
  feature_settings:
    path: ../../packages/features/settings
  feature_tools:
    path: ../../packages/features/tools
  feature_library:
    path: ../../packages/features/library
  feature_scan:
    path: ../../packages/features/scan
  feature_home:
    path: ../../packages/features/home
  engine_billing:
    path: ../../packages/engines/billing
  # Ads for the free build (ADR-0013). The only package with an ads SDK.
  engine_ads:
    path: ../../packages/engines/ads
  engine_security:
    path: ../../packages/engines/security
  engine_reminders:
    path: ../../packages/engines/reminders
  engine_vision:
    path: ../../packages/engines/vision
  engine_conversion:
    path: ../../packages/engines/conversion
  engine_scanner:
    path: ../../packages/engines/scanner
  engine_ocr:
    path: ../../packages/engines/ocr
  engine_pdf:
    path: ../../packages/engines/pdf
  engine_imaging:
    path: ../../packages/engines/imaging
  docscan_data:
    path: ../../packages/data
  docscan_design_system:
    path: ../../packages/design_system
  docscan_contracts:
    path: ../../packages/contracts
  docscan_domain:
    path: ../../packages/domain
  docscan_core:
    path: ../../packages/core
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  path_provider: ^2.1.6
  # Licensing: checkout and the 180 Pay portal open in the external browser.
  url_launcher: ^6.3.2

dev_dependencies:
  integration_test:
    sdk: flutter
  drift: ^2.35.0
  flutter_test:
    sdk: flutter
  image: ^4.10.1
  mocktail: ^1.0.5
  pdfrx: ^2.6.5
  # Licensing end-to-end test (test/licence_e2e_test.dart): the real
  # licence server in-process.
  crypto: ^3.0.6
  engine_license:
    path: ../../packages/engines/license
  http: ^1.6.0
  license_server:
    path: ../license_server
  shelf: ^1.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    # AdMob IDs, shared with Gradle (ADR-0013).
    - assets/config/admob.json
