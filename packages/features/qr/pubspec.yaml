name: feature_qr
description: "Feature module: offline QR & barcode scanner, result actions, generator and local history."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  docscan_design_system:
    path: ../../../packages/design_system
  docscan_contracts:
    path: ../../../packages/contracts
  docscan_domain:
    path: ../../../packages/domain
  docscan_core:
    path: ../../../packages/core
  engine_codes:
    path: ../../../packages/engines/codes
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  # Hands links to the browser / mail / phone / maps apps. Not an HTTP
  # client: this app never opens a connection itself (ADR-0008).
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  engine_authenticator:
    path: ../../../packages/engines/authenticator
  engine_security:
    path: ../../../packages/engines/security
