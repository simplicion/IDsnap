name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Codegen (Drift)
        working-directory: packages/data
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Format check
        run: dart run melos run format:check

      - name: Analyze
        run: dart analyze --fatal-infos .

      - name: Test all packages
        shell: bash
        run: |
          set -euo pipefail
          failed=()
          for dir in $(find apps packages -type d -name test -not -path '*/build/*' -not -path '*/.dart_tool/*' | sort); do
            pkg="$(dirname "$dir")"
            echo "::group::$pkg"
            if ! (cd "$pkg" && flutter test --no-pub --reporter expanded); then failed+=("$pkg"); fi
            echo "::endgroup::"
          done
          if ((${#failed[@]})); then echo "::error::Tests failed in: ${failed[*]}"; exit 1; fi

  docs-web:
    name: Build docs site
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/sync_docs.dart
      - name: Build web
        working-directory: apps/docs
        run: flutter build web --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: docs-web
          path: apps/docs/build/web
          retention-days: 7

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Codegen (Drift)
        working-directory: packages/data
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
      - name: Build debug APK
        working-directory: apps/scanner
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-debug-apk
          path: apps/scanner/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
