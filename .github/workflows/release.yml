name: Release

# Builds signed Android release artifacts for a version tag (vX.Y.Z).
#
# Required repository secrets (Settings > Secrets and variables > Actions).
# The job FAILS if any is missing — it never publishes a debug-signed or
# misconfigured build.
#   ANDROID_KEYSTORE_BASE64     base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias inside the keystore
#   ANDROID_KEY_PASSWORD        key password
#   IDSNAP_LICENSE_URL          https base URL of the 180 Pay licence server
#                               (ADR-0012; see packages/engines/billing/lib/src/licence/licence_config.dart)
#   IDSNAP_LICENSE_PUBLIC_KEY   licence server Ed25519 PUBLIC key, base64url
#                               (apps/license_server/tool/keygen.dart). Never the dev key.
#   IDSNAP_SUPPORT_EMAIL        support mailbox shown in the app
#   (Licence defines per docs/adr/0012-180pay-licence-server.md. To pin TLS to the
#   licence host, edit res/xml/network_security_config.xml per deployment.)
# Optional:
#   IDSNAP_BILLING              "store" selects legacy Play Billing/StoreKit (default: licence)
#   IDSNAP_PLAY_LICENSE_KEY     Play Console licence key; only used when the
#                               build selects store billing (IDSNAP_BILLING=store).
#
# Outputs: idsnap-<tag>.aab (upload to Google Play), per-ABI APKs for direct
# downloads (arm64-v8a for modern phones, armeabi-v7a for old ones; no x86_64)
# and the Dart symbol files needed to read obfuscated stack traces.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IDSNAP_LICENSE_URL: ${{ secrets.IDSNAP_LICENSE_URL }}
          IDSNAP_LICENSE_PUBLIC_KEY: ${{ secrets.IDSNAP_LICENSE_PUBLIC_KEY }}
          IDSNAP_SUPPORT_EMAIL: ${{ secrets.IDSNAP_SUPPORT_EMAIL }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      ANDROID_KEY_PASSWORD IDSNAP_LICENSE_URL IDSNAP_LICENSE_PUBLIC_KEY \
                      IDSNAP_SUPPORT_EMAIL; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if ((${#missing[@]})); then
            echo "::error::Missing release secrets: ${missing[*]}. Refusing to build an unsigned or misconfigured release."
            exit 1
          fi
          case "$IDSNAP_LICENSE_URL" in
            https://*) ;;
            *) echo "::error::IDSNAP_LICENSE_URL must be an https URL."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Codegen (Drift)
        working-directory: packages/data
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -E '^version:' apps/scanner/pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/scanner/pubspec.yaml version ${version}. Bump version (and the +build number) first."
            exit 1
          fi

      - name: Configure signing
        working-directory: apps/scanner/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > key.properties

      - name: Write dart-defines
        env:
          IDSNAP_LICENSE_URL: ${{ secrets.IDSNAP_LICENSE_URL }}
          IDSNAP_LICENSE_PUBLIC_KEY: ${{ secrets.IDSNAP_LICENSE_PUBLIC_KEY }}
          IDSNAP_SUPPORT_EMAIL: ${{ secrets.IDSNAP_SUPPORT_EMAIL }}
          IDSNAP_BILLING: ${{ secrets.IDSNAP_BILLING }}
          IDSNAP_PLAY_LICENSE_KEY: ${{ secrets.IDSNAP_PLAY_LICENSE_KEY }}
        run: |
          # A file keeps the values out of the command line and the logs.
          # Optional defines are written only when set: an empty define
          # would override the in-code default (e.g. IDSNAP_BILLING=licence).
          python3 - <<'PY' > "$RUNNER_TEMP/release-defines.json"
          import json, os
          required = ["IDSNAP_LICENSE_URL", "IDSNAP_LICENSE_PUBLIC_KEY", "IDSNAP_SUPPORT_EMAIL"]
          optional = ["IDSNAP_BILLING", "IDSNAP_PLAY_LICENSE_KEY"]
          defines = {k: os.environ[k] for k in required}
          defines.update({k: os.environ[k] for k in optional if os.environ.get(k)})
          print(json.dumps(defines))
          PY

      - name: Build App Bundle (Google Play)
        working-directory: apps/scanner
        run: |
          flutter build appbundle --release --no-pub \
            --dart-define-from-file="$RUNNER_TEMP/release-defines.json" \
            --obfuscate --split-debug-info=build/symbols/aab

      - name: Build per-ABI APKs (direct download)
        working-directory: apps/scanner
        run: |
          flutter build apk --release --no-pub --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --dart-define-from-file="$RUNNER_TEMP/release-defines.json" \
            --obfuscate --split-debug-info=build/symbols/apk

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          out=apps/scanner/build/app/outputs
          cp "$out/bundle/release/app-release.aab" "dist/idsnap-${GITHUB_REF_NAME}.aab"
          cp "$out/flutter-apk/app-arm64-v8a-release.apk" "dist/idsnap-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp "$out/flutter-apk/app-armeabi-v7a-release.apk" "dist/idsnap-${GITHUB_REF_NAME}-armeabi-v7a.apk"
          (cd apps/scanner/build && zip -qr "../../../dist/idsnap-${GITHUB_REF_NAME}-symbols.zip" symbols)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Remove signing material
        if: always()
        run: rm -f apps/scanner/android/app/upload.jks apps/scanner/android/key.properties "$RUNNER_TEMP/release-defines.json"

      - uses: actions/upload-artifact@v4
        with:
          name: idsnap-release-${{ github.ref_name }}
          path: dist/*
          retention-days: 30

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Symbols stay in the workflow artifact, not on the public release.
          files: |
            dist/*.aab
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
