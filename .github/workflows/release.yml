name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Codegen (Drift)
        working-directory: packages/data
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Configure signing
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/scanner/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/upload.jks
          cat > key.properties <<EOF
          storeFile=upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK and App Bundle
        working-directory: apps/scanner
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Collect artifacts
        run: |
          mkdir -p dist
          suffix=$([ "$HAS_SIGNING" = "true" ] && echo "" || echo "-unsigned")
          cp apps/scanner/build/app/outputs/flutter-apk/app-release.apk "dist/docscan-${GITHUB_REF_NAME}${suffix}.apk"
          cp apps/scanner/build/app/outputs/bundle/release/app-release.aab "dist/docscan-${GITHUB_REF_NAME}${suffix}.aab"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
