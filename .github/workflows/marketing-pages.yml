name: Deploy Marketing Web to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "apps/marketing-web/**"
      - ".github/workflows/marketing-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/marketing-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/marketing-web/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build static site with Astro
        run: npm run build

      - name: Ensure Cloudflare Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create idsnap --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/marketing-web
          command: pages deploy dist --project-name=idsnap --branch=${{ github.event_name == 'push' && 'main' || github.head_ref || 'preview' }} --commit-dirty=true

