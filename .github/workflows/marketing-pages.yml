name: Deploy Marketing Web to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/marketing-web/**"
      - ".github/workflows/marketing-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/marketing-web/**"
      - ".github/workflows/marketing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/marketing-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/marketing-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site with Astro
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=idsnap --force ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--branch=main' || '' }}

